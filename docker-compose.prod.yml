services:
  client:
    build:
      context: ./client
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: https://umattend.site
    image: umattend-client:prod
    container_name: umattend_client_prod
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./client/.env.production
    environment:
      PORT: "3000"
      NODE_ENV: production
    networks:
      - umattend_net

  redis:
    image: redis:7-alpine
    container_name: umattend_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass password
    networks:
      - umattend_net

  server:
    build:
      context: ./server
    image: umattend-server:prod
    container_name: umattend_server_prod
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./server/.env.production
    environment:
      PORT: "4000"
      REDIS_HOST: "redis"
    depends_on:
      - redis
    networks:
      - umattend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: umattend_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - umattend_net

networks:
  umattend_net:
    driver: bridge
