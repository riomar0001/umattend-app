services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.1
    container_name: umattend_otel_lgtm_staging
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4321:4318"   # OTLP HTTP
    environment:
      GF_SERVER_ROOT_URL: https://staging.umattend.site/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/prometheus/prometheus.staging.yml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana/provisioning/dashboards/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/umattend-dashboards.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - otel_lgtm_grafana_staging:/var/lib/grafana
      - otel_lgtm_prometheus_staging:/prometheus
      - otel_lgtm_loki_staging:/loki
      - otel_lgtm_tempo_staging:/tmp/tempo
    networks:
      - observability_net

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: umattend_node_exporter_staging
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - observability_net

volumes:
  otel_lgtm_grafana_staging:
  otel_lgtm_prometheus_staging:
  otel_lgtm_loki_staging:
  otel_lgtm_tempo_staging:

networks:
  observability_net:
    driver: bridge
