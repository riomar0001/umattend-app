name: umattend-observability-prod

services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.26.0
    container_name: umattend_otel_lgtm_prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:3000"   # Grafana (nginx proxies /grafana/)
      - "127.0.0.1:4319:4317"   # OTLP gRPC — different host port from staging
      - "127.0.0.1:4320:4318"   # OTLP HTTP — different host port from staging
    environment:
      GF_SERVER_ROOT_URL: https://umattend.site/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
    volumes:
      - ./observability/prometheus/prometheus.prod.yml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana/provisioning/dashboards/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/umattend-dashboards.yaml:ro
      - ./observability/grafana/provisioning/datasources/datasource.yml:/otel-lgtm/grafana/conf/provisioning/datasources/umattend-datasources.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - otel_lgtm_grafana_prod:/var/lib/grafana
      - otel_lgtm_prometheus_prod:/prometheus
      - otel_lgtm_loki_prod:/loki
      - otel_lgtm_tempo_prod:/tmp/tempo
    networks:
      - observability_net

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: umattend_node_exporter_prod
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - observability_net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: umattend_postgres_exporter_prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_SOURCE_NAME: "${POSTGRES_DSN_PROD:?POSTGRES_DSN_PROD is required}"
    expose:
      - "9187"
    networks:
      - observability_net

  redis-exporter:
    image: oliver006/redis_exporter:v1.68.0
    container_name: umattend_redis_exporter_prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_ADDR: "redis://host.docker.internal:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    expose:
      - "9121"
    networks:
      - observability_net

  promtail:
    image: grafana/promtail:3.5.0
    container_name: umattend_promtail_prod
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/promtail.prod.yml:/etc/promtail/promtail.yml:ro
    networks:
      - observability_net

volumes:
  otel_lgtm_grafana_prod:
  otel_lgtm_prometheus_prod:
  otel_lgtm_loki_prod:
  otel_lgtm_tempo_prod:

networks:
  observability_net:
    driver: bridge
