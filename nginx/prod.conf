upstream client {
    server client:3000;
}

upstream api {
    server server:4000;
}

upstream grafana {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name umattend.site www.umattend.site;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 10m;

    # Redirect bare /grafana → /grafana/ so the prefix block below always matches
    location = /grafana {
        return 301 $scheme://$host/grafana/;
    }

    # ^~ stops nginx checking regex rules once this longest prefix matches,
    # ensuring /grafana/* never falls through to the Next.js catch-all.
    # proxy_pass has NO trailing URI so nginx forwards the full /grafana/... path;
    # Grafana's serve_from_sub_path=true then routes it correctly.
    location ^~ /grafana/ {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
    }
}
