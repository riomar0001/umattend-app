upstream prod_client {
    server 127.0.0.1:3000;
}

# The API is a Cloudflare Worker now, not a local pm2 process.
#
# Preferred setup: skip nginx for /api entirely — give the Worker a Custom
# Domain (api.umattend.site) and let the Next.js client proxy /api to it, as
# staging does. Then this block is unused.
#
# NOTE: api.umattend.site does not resolve yet. Add it as a Custom Domain on
# the `umattend-api` Worker before relying on this path.
upstream prod_api {
    server api.umattend.site:443;
}

server {
    listen 80;
    server_name umattend.site www.umattend.site;

    client_max_body_size 10m;

    access_log /var/log/nginx/production.access.log;
    error_log /var/log/nginx/production.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https: wss:;" always;

    location /api/ {
        proxy_pass https://prod_api;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        # The Worker is selected by SNI/Host, so this must be its hostname
        # rather than $host — a second `Host` line here would override it.
        proxy_set_header Host api.umattend.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /_next/ {
        proxy_pass http://prod_client;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Repeat security headers — add_header in a location block resets the parent's headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https: wss:;" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://prod_client;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}