# OTLP receiver config (required by otel-lgtm image)
otlp:
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name

storage:
  tsdb:
    out_of_order_time_window: 10m

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging

scrape_configs:
  - job_name: umattend-server
    static_configs:
      - targets: ['host.docker.internal:4001']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: otelcol
    static_configs:
      - targets: ['localhost:8888']

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
